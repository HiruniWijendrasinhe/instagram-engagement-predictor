<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Engagement Predictor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-top: #fff2e5;
    --bg-bottom: #ffc89f;
    --card-bg: #fffdfb;
    --text-main: #2f231b;
    --text-soft: #7c5a47;
    --accent: #ff6b35;
    --accent-2: #ff9f1c;
    --line: #f2d8c6;
    --success-bg: #fff4df;
    --error-bg: #ffe5e7;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Manrope', sans-serif;
    color: var(--text-main);
    background:
        radial-gradient(circle at 10% 15%, rgba(255, 216, 182, 0.8), transparent 28%),
        radial-gradient(circle at 85% 8%, rgba(255, 188, 145, 0.7), transparent 30%),
        linear-gradient(140deg, var(--bg-top), var(--bg-bottom));
    display: flex;
    justify-content: center;
    padding: 30px 16px;
}

/* LAYOUT */
.page-wrap {
    width: min(1120px, 100%);
    display: grid;
    gap: 20px;
}

.app-shell {
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
}

/* HERO */
.hero {
    padding: 34px;
    background: linear-gradient(160deg,#fff8f1,#ffe9d6,#ffd5b4);
}

.brand {
    display: flex;
    gap: 10px;
    align-items: center;
}

.hero h1 {
    margin: 10px 0;
}

/* FORM PANEL */
.panel {
    padding: 34px 30px;
    background: var(--card-bg);
}

/* GRID */
.field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field.full {
    grid-column: 1 / -1;
}

/* INPUT */
input, select {
    padding: 10px;
    border-radius: 11px;
    border: 1px solid var(--line);
}

input:focus, select:focus {
    outline: none;
    border-color: #f59f57;
}

/* BUTTON IMPROVED */
button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 13px;
    font-weight: 800;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b35, #ff9f1c);
    transition: all 0.25s ease;
    box-shadow: 0 10px 25px rgba(255,106,52,0.35);
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

.model-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

.model-btn.secondary {
    background: linear-gradient(135deg,#c85b2d,#ea7f35);
}

/* RESULT IMPROVED */
.result {
    display: none;
    margin-top: 18px;
    padding: 18px;
    border-radius: 14px;
    text-align: center;
    font-weight: 800;
    animation: fadeIn 0.4s ease;
}

.result.success {
    background: linear-gradient(135deg,#fff4df,#ffe8c7);
    color: #7a4a1f;
}

.result.error {
    background: linear-gradient(135deg,#ffe5e7,#ffd6d9);
    color: #8d2f3b;
}

.result span {
    display: block;
    font-size: 1.6rem;
    margin-top: 8px;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<main class="page-wrap">

<section class="app-shell">

<!-- HERO -->
<section class="hero">
    <div class="brand">
        <img src="/static/assets/logo.svg" width="50">
        <strong>EngageVision Studio</strong>
    </div>
    <h1>Predict engagement before your next post.</h1>
    <p>Use your trained ML model to estimate engagement instantly.</p>
    <img src="/static/assets/hero-analytics.svg" style="width:100%; border-radius:16px;">
</section>

<!-- FORM -->
<section class="panel">
    <h2>Instagram Engagement Predictor</h2>

<form id="predictForm">
<div class="field-grid">

<select name="media_type">
<option>Carousel</option>
<option>Video</option>
<option>Reel</option>
<option>Photo</option>
</select>

<input name="likes" type="number" placeholder="Likes">
<input name="comments" type="number" placeholder="Comments">
<input name="shares" type="number" placeholder="Shares">
<input name="saves" type="number" placeholder="Saves">
<input name="reach" type="number" placeholder="Reach">
<input name="impressions" type="number" placeholder="Impressions">
<input name="caption_length" type="number" placeholder="Caption Length">
<input name="hashtags_count" type="number" placeholder="Hashtags">
<input name="followers_gained" type="number" placeholder="Followers Gained">
<input name="share_rate" type="number" placeholder="Share Rate">
<input name="save_rate" type="number" placeholder="Save Rate">
<input name="engagement_score" type="number" placeholder="Engagement Score">

<select name="traffic_source" class="full">
<option>Explore</option>
<option>Home Feed</option>
<option>Reels Feed</option>
</select>

<select name="content_category" class="full">
<option>Fitness</option>
<option>Fashion</option>
<option>Technology</option>
<option>Travel</option>
</select>

</div>

<div class="model-actions">
<button type="submit" data-model="xgboost">XGBoost</button>
<button type="submit" class="model-btn secondary" data-model="random_forest">Random Forest</button>
</div>

</form>

<div id="result" class="result"></div>

</section>
</section>
</main>

<script>
let selectedModel = 'xgboost';

document.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",()=>{
        selectedModel = btn.dataset.model;
    });
});

document.getElementById("predictForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const form = e.target;
    const data = Object.fromEntries(new FormData(form).entries());
    const resultDiv = document.getElementById("result");

    try{
        const res = await fetch(`/predict/${selectedModel}`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify(data)
        });

        const result = await res.json();

        resultDiv.style.display="block";

        if(result.predicted_engagement){
            resultDiv.className="result success";
            resultDiv.innerHTML = `
                ${selectedModel.toUpperCase()} Prediction
                <span>${Number(result.predicted_engagement).toFixed(4)}</span>
            `;
        } else {
            resultDiv.className="result error";
            resultDiv.innerText = result.error;
        }

    } catch(err){
        resultDiv.style.display="block";
        resultDiv.className="result error";
        resultDiv.innerText = err.message;
    }
});
</script>

</body>
</html>
